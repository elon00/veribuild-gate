name: Local artifact comparison regression (not production acceptance)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources (fail closed)
        run: python -m compileall -q src tests
      - name: Rust compilation
        run: cargo check --all-targets
      - name: Real local comparator subprocess tests
        run: python -m unittest discover -s tests -p 'reality_*.py' -v
